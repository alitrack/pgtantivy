[package]
name = "pgtantivy"
version = "0.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg19 = ["pgrx/pg19"]
pg_test = []

[dependencies]
pgrx = "=0.20.0"
tantivy = { version = "=0.24.2", default-features = false, features = ["mmap", "stopwords", "lz4-compression"] }
jieba-rs = "0.7"
unicode-normalization = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
object_store = { version = "0.14", features = ["aws", "serde_json", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
bytes = "1"
futures = "0.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
